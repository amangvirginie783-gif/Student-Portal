<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background-color: white;
            width: 350px;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #003366;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #0055a5;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #003366;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: #0055a5;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>Student Login</h1>

        <p class="subtitle">University of Excellence</p>

        <form>

            <label for="email">Email</label>
            <input 
                type="email" 
                id="email" 
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input 
                type="password" 
                id="password" 
                placeholder="Enter your password"
                required
            >

            <button type="submit">Login</button>

        </form>

        <div class="links">
            <p>Don't have an account?
                <a href="register.html">Register</a>
            </p>

            <p>
                <a href="index.html">Back to Home</a>
            </p>
        </div>

    </div>

</body>
</html>
